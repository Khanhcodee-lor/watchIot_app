name: watchiot
description: Smartwatch Fall & Health Monitor for Android and iOS.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  firebase_database: ^11.0.0
  provider: ^6.1.0
  fl_chart: ^0.68.0
  url_launcher: ^6.3.0
  audioplayers: ^6.0.0
  intl: ^0.19.0
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/login_watch_hero.png
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
  licenses:
    - assets/fonts/OFL.txt
